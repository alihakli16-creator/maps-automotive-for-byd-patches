name: Build Turkish Morphe Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 35 and Build Tools 36.0.0
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;36.0.0"

      - name: Download Pinned Morphe Desktop CLI
        run: |
          curl -L -o morphe-desktop-1.18.1-all.jar "https://github.com/MorpheApp/morphe-desktop/releases/download/v1.18.1/morphe-desktop-1.18.1-all.jar"
          echo "1b506ab5f03d16a2f65026d5e0e1910d01fc1e2152f21eaeb44ed2f30856597b  morphe-desktop-1.18.1-all.jar" | sha256sum -c

      - name: Build Turkish .mpp Bundle
        run: |
          python3 build.py \
            --sdk "$ANDROID_HOME" \
            --cli morphe-desktop-1.18.1-all.jar \
            --out build-out

      - name: Upload .mpp as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maps-automotive-byd-turkish-preview9
          path: build-out/*.mpp

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        continue-on-error: true
        with:
          tag_name: turkish-preview.9
          name: "Maps Automotive for BYD - Türkçe Preview 9"
          body: "Türkçe yerelleştirilmiş Morphe yama paketi (.mpp). Morphe Desktop veya Morphe Manager içerisine Local Source olarak ekleyebilirsiniz."
          files: build-out/*.mpp
